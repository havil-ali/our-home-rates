name: Update market rates
on:
  schedule:
    - cron: '17 * * * *'   # every hour
  workflow_dispatch:        # "Run workflow" button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_rates.py
      - name: Save if changed
        run: |
          git config user.name "rates bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "Rates $(date -u +%Y-%m-%dT%H:%M)"
          git push
